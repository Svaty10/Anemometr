# Installed by the Anemometr project (vitr) – NOT part of the tank hub (retencka).
# Attaches the anemometer radio bridge to retencka at start-up without changing its files;
# it survives retencka updates. Remove this file and restart retencka to undo it:
#   sudo rm /etc/systemd/system/retencka.service.d/vitr-most.conf
#   sudo systemctl daemon-reload && sudo systemctl restart retencka
[Service]
Environment=PYTHONPATH=/opt/vitr/current/system/retencka-most
