<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Vlastní účet | Vítr</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body class="auth-body">
    <div class="login-box">
        <div class="auth-brand"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5h10.5a3 3 0 1 0-3-3M3 12.5h15a3 3 0 1 1-3 3M3 16.5h6.5"/></svg>Vítr</div>
        <h1>Vytvořte si účet</h1>
        <p>Výchozí účet <code>admin</code> s kódem z instalace slouží jen k prvnímu přihlášení.
           Po vytvoření vlastního účtu bude zrušen.</p>
        <div id="err" class="alert-danger hidden" role="alert"></div>
        <form id="setupForm">
            <div class="form-group">
                <label for="username">Vaše uživatelské jméno</label>
                <input type="text" id="username" required autocomplete="username" maxlength="32" autofocus>
            </div>
            <div class="form-group">
                <label for="password">Nové heslo (min. 10 znaků)</label>
                <input type="password" id="password" required minlength="10" autocomplete="new-password">
            </div>
            <div class="form-group">
                <label for="password2">Heslo znovu</label>
                <input type="password" id="password2" required minlength="10" autocomplete="new-password">
            </div>
            <button type="submit" id="btn">Vytvořit účet a pokračovat</button>
        </form>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
