<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Přihlášení | Vítr</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body class="auth-body">
    <div class="login-box">
        <div class="auth-brand"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8.5h10.5a3 3 0 1 0-3-3M3 12.5h15a3 3 0 1 1-3 3M3 16.5h6.5"/></svg>Vítr</div>
        <h1>Přihlášení</h1>
        <div id="firstInfo" class="alert-info hidden">
            <strong>První přihlášení</strong><br>
            Uživatelské jméno <code>admin</code> a kód z instalace
            (na Raspberry Pi <code>sudo cat /var/lib/vitr/setup_code</code>). Poté si vytvoříte vlastní
            účet a výchozí přístup se zruší.
        </div>
        <div id="err" class="alert-danger hidden" role="alert"></div>
        <form id="loginForm" autocomplete="on">
            <div class="form-group">
                <label for="username">Uživatelské jméno</label>
                <input type="text" id="username" name="username" required autofocus autocomplete="username" maxlength="32">
            </div>
            <div class="form-group">
                <label for="password">Heslo</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" maxlength="256">
            </div>
            <button type="submit" id="btn">Přihlásit se</button>
        </form>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
