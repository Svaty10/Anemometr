<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>Přihlášení | Vítr</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/css/style.css">
    <script src="/js/theme.js"></script>
</head>
<body class="auth-body">
    <div class="login-box">
        <div class="auth-brand"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3"/><path d="M3 12h16a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg>Vítr</div>
        <h1>Přihlášení</h1>
        <div id="err" class="alert-danger hidden" role="alert"></div>
        <form id="loginForm" autocomplete="on">
            <input type="text" name="username" value="spravce" autocomplete="username" hidden>
            <div class="form-group">
                <label for="password">Heslo</label>
                <input type="password" id="password" name="password" required autofocus autocomplete="current-password" maxlength="256">
            </div>
            <button type="submit" id="btn">Přihlásit se</button>
        </form>
        <p class="muted small">Heslo z první instalace: na Raspberry Pi <code>sudo cat /var/lib/vitr/heslo.txt</code></p>
    </div>
    <script src="/js/login.js"></script>
</body>
</html>
